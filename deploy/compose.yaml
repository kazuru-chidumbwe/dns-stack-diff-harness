services:
  auth:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/Corefile"]
    volumes:
      - ./coredns/Corefile:/Corefile:ro
      - ./coredns/zones:/zones:ro
    networks:
      dnsnet:
        ipv4_address: 172.30.0.10

  unbound:
    image: mvance/unbound:1.20.0
    volumes:
      - ./resolvers/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    depends_on:
      - auth
    networks:
      dnsnet:
        ipv4_address: 172.30.0.20
    ports:
      - "9053:53/udp"
      - "9053:53/tcp"

  # CoreDNS-as-forwarder stand-in (NodeLocal-class role). Replaces v0 dnsmasq.
  coredns_fwd:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/Corefile"]
    volumes:
      - ./resolvers/coredns-fwd/Corefile:/Corefile:ro
    depends_on:
      - auth
    networks:
      dnsnet:
        ipv4_address: 172.30.0.30
    ports:
      - "9054:53/udp"
      - "9054:53/tcp"
    cap_add:
      - NET_BIND_SERVICE


networks:
  dnsnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

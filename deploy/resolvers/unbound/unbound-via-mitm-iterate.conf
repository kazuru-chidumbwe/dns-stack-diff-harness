# unbound via MITM — ITERATOR path (positive-control topology)

# DO NOT use forward-zone name: "." → MITM for CVE-2025-11411 positive control.
# That path trusts the forwarder and skips iterator delegation-cache updates.
#
# Intent: Unbound recurses; MITM sits on the authority path for lab.stackdiff
# so injected AUTHORITY NS can update an already-held delegation.
#
# Operator must still:
#   1) Port NLnet CVE-2025-11411 vendor test vectors into the MITM
#   2) Prime a legit resolution under lab.stackdiff before the inject trial
#   3) Confirm glue_cache_accept=true on Unbound 1.24.0 before any 1.24.1+ cell
#
# Stub below is a starting sketch — tune stub/auth addresses to compose DNS net.

server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 allow
    username: ""
    domain-insecure: "lab.stackdiff."
    cache-min-ttl: 0
    cache-max-ttl: 60
    prefetch: no
    # Prefer full recursion for the lab zone; do not forward "." to MITM.
    do-not-query-localhost: no

# Point the zone cut at the MITM (authority path), not a forward-zone for ".".
# MITM then upstreams to auth (172.30.0.10) per compose.adversarial.yaml.
stub-zone:
    name: "lab.stackdiff."
    stub-addr: 172.30.0.11
    stub-prime: yes

remote-control:
    control-enable: no

# unbound — iterator path with parent stub (CVE-2025-11411 positive control)
#
# Do NOT stub lab.stackdiff directly (that pins NS and skips delegation-cache updates).
# Stub parent stackdiff. → parent auth; Unbound learns lab.stackdiff NS via referral
# to MITM, then AUTHORITY NS on positive A replies can update that delegation.

server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 allow
    username: ""
    domain-insecure: "stackdiff."
    domain-insecure: "lab.stackdiff."
    domain-insecure: "attacker.example."
    cache-min-ttl: 0
    cache-max-ttl: 30
    prefetch: no
    do-not-query-localhost: no
    qname-minimisation: no
    target-fetch-policy: "0 0 0 0 0"

stub-zone:
    name: "stackdiff."
    stub-addr: 172.30.0.12
    stub-prime: yes

remote-control:
    control-enable: no

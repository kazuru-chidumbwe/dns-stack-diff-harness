server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 allow
    username: ""
    directory: "/opt/unbound/etc/unbound"
    pidfile: "/opt/unbound/etc/unbound/unbound.pid"
    domain-insecure: "lab.stackdiff."
    cache-min-ttl: 0
    cache-max-ttl: 120
    prefetch: no
    prefetch-key: no
    serve-expired: no
    qname-minimisation: no
    module-config: "iterator"
    val-permissive-mode: yes

forward-zone:
    name: "."
    forward-addr: 172.31.0.30
